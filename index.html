<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Labs</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#111}
header{padding:20px 32px;display:flex;justify-content:space-between;max-width:1100px;margin:0 auto}
main{max-width:1100px;margin:0 auto;padding:60px 32px}
h1{font-size:64px;line-height:1;margin:0}
h1 span{color:#FF8A1E}
p{color:#666;font-size:18px;max-width:480px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:60px}
.box{border:1px solid #eee;border-radius:16px;padding:24px}
footer{max-width:1100px;margin:80px auto 0;padding:24px 32px;border-top:1px solid #eee;color:#999;font-size:14px}
@media(max-width:700px){h1{font-size:42px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div><b>PIXEL LABS</b></div>
<div><a href="#" style="color:#111;text-decoration:none">github →</a></div>
</header>
<main>
<h1>Badamy<br><span>piksele.</span><br>Tworzymy<br>światy.</h1>
<p>Małe studio indie. Gry i strony. Evolution z Bursztyn Studio.</p>
<div class="grid">
<div class="box"><h3>Games Lab</h3><p>Małe gry indie. Pixel art, Godot.</p></div>
<div class="box"><h3>Web Lab</h3><p>Nowoczesne strony i apki.</p></div>
</div>
</main>
<footer>© 2026 Pixel Labs</footer>
</body>
</html>
